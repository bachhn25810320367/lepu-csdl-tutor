<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LEPU · Gia sư CSDL — Ôn thi Cơ sở dữ liệu EPU</title>
  <meta name="description" content="Hệ thống học Cơ sở dữ liệu EPU: đọc bài bên trái, hỏi gia sư AI bên phải. Mô hình trả lời chỉ dựa trên bài học đang mở.">
  <meta name="color-scheme" content="dark light">
  <meta property="og:title" content="LEPU · Gia sư CSDL">
  <meta property="og:description" content="Đọc bài bên trái, hỏi gia sư AI bên phải — trả lời chỉ dựa trên bài học.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/app.css?v=28">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141316'/%3E%3Crect x='9' y='13' width='14' height='2' fill='%23f5f2eb'/%3E%3Crect x='9' y='18' width='14' height='2' fill='%23f5f2eb'/%3E%3Crect x='9' y='23' width='9' height='2' fill='%23f5f2eb'/%3E%3C/svg%3E">
</head>
<body>
  <!-- ============ topbar: breadcrumb + nút chat (kiểu Studley) ============ -->
  <header class="topbar">
    <div class="read-progress" id="readProgress"></div>
    <button class="icon-btn nav-toggle" id="btnNav" type="button" title="Mở/đóng mục lục" aria-label="Mở hoặc đóng mục lục" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>

    <nav class="crumbs" aria-label="Đường dẫn">
      <a class="crumb logo-badge" href="#" id="crumbRoot">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        <span>LEPU</span>
      </a>
      <span class="sep" aria-hidden="true">›</span>
      <span class="crumb dim" id="crumbSubject">CSDL</span>
      <span class="sep" aria-hidden="true">›</span>
      <span class="crumb cur" id="crumbDoc">…</span>
    </nav>

    <div class="spacer"></div>

    <span class="doc-meta" id="docMeta">…</span>

    <div class="status-chip" id="statusChip" data-state="" title="Trạng thái kết nối AI">
      <span class="dot" aria-hidden="true"></span>
      <span class="txt">Đang kiểm tra</span>
    </div>

    <!-- nút chat: mở/đóng panel gia sư AI -->
    <button class="chat-btn" id="btnChat" type="button" title="Gia sư AI (Ctrl+K để hỏi)" aria-label="Mở gia sư AI" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>
      </svg>
      <span class="chat-btn-txt">Gia sư AI</span>
    </button>

    <button class="icon-btn" id="btnTheme" type="button" title="Đổi nền sáng/tối" aria-label="Đổi nền sáng hoặc tối">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </header>

  <main class="shell" id="shell">
      <!-- ============ sidebar: mục lục bài đang mở (kiểu Studley) ============ -->
      <nav class="sidebar" id="sidebar" aria-label="Mục lục bài học">
        <div class="side-head">
          <label class="side-label" for="docSel">Bài học</label>
          <select class="doc-select" id="docSel" aria-label="Chọn bài học"></select>
        </div>

        <nav class="side-modes" id="sideModes" aria-label="Chế độ ôn tập">
          <button class="smode on" type="button" data-mode="content" title="Đọc bài học">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/></svg>
            <span>Đọc bài</span>
          </button>
          <button class="smode" type="button" data-mode="mcq" title="Trắc nghiệm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.4a2.9 2.9 0 1 1 4.2 2.4c-.7.5-1.4 1-1.4 2.2"/><path d="M12 17h.01"/></svg>
            <span>Trắc nghiệm</span>
            <em data-n="mcq">0</em>
          </button>
          <button class="smode" type="button" data-mode="cards" title="Flashcards">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="12" rx="2"/><path d="M7 4h11a2 2 0 0 1 2 2v9"/></svg>
            <span>Thẻ bài</span>
            <em data-n="cards">0</em>
          </button>
          <button class="smode" type="button" data-mode="fill" title="Điền vào chỗ trống">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h5M13 7h7M4 17h3M11 17h9"/><path d="M10 6.2v1.6M8 16.2v1.6"/></svg>
            <span>Điền chỗ trống</span>
            <em data-n="fill">0</em>
          </button>
          <button class="smode" type="button" data-mode="written" title="Tự luận">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M6 16l3.4-4 3 2.4L20 7"/><path d="M16 7h4v4"/></svg>
            <span>Tự luận</span>
            <em data-n="written">0</em>
          </button>
          <button class="smode" type="button" data-mode="notes" title="Ghi chú của tôi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>
            <span>Ghi chú</span>
          </button>
        </nav>

        <div class="side-scroll" id="sideScroll">
          <div id="tocZone">
            <div class="side-label side-sub">Mục lục</div>
            <ul class="toc" id="toc"></ul>
          </div>
          <div id="progZone" hidden></div>
        </div>
      </nav>

      <div class="scrim" id="scrim" hidden></div>

      <!-- ============ cột nội dung: bài học + các chế độ ôn tập ============ -->
      <section class="doc-pane" aria-label="Nội dung bài học">
        <div class="doc-scroll" id="docScroll">
          <article class="md" id="docBody"></article>
        </div>

        <!-- ---- Trắc nghiệm ---- -->
        <div class="mode-pane" id="paneMcq" hidden>
          <div class="qp-head">
            <div>
              <h1 class="qp-title">Trắc nghiệm</h1>
              <p class="qp-sub" id="mcqSub">—</p>
            </div>
            <div class="qp-tools">
              <div class="qp-bar" title="Tiến độ"><i id="mcqBar"></i></div>
              <button class="btn-ghost" id="mcqReset" type="button">Làm lại</button>
            </div>
          </div>
          <div class="qp-body" id="mcqBody"></div>
        </div>

        <!-- ---- Flashcards ---- -->
        <div class="mode-pane" id="paneCards" hidden>
          <div class="qp-head">
            <div>
              <h1 class="qp-title">Flashcards</h1>
              <p class="qp-sub" id="cardsSub">—</p>
            </div>
            <div class="qp-tools">
              <div class="qp-bar" title="Thẻ đã xem"><i id="cardsBar"></i></div>
              <button class="btn-ghost" id="cardsReset" type="button">Xáo trộn lại</button>
            </div>
          </div>
          <div class="qp-body" id="cardsBody"></div>
        </div>

        <!-- ---- Điền vào chỗ trống ---- -->
        <div class="mode-pane" id="paneFill" hidden>
          <div class="qp-head">
            <div>
              <h1 class="qp-title">Điền vào chỗ trống</h1>
              <p class="qp-sub" id="fillSub">—</p>
            </div>
            <div class="qp-tools">
              <div class="qp-bar" title="Tiến độ"><i id="fillBar"></i></div>
              <button class="btn-ghost" id="fillReset" type="button">Làm lại</button>
            </div>
          </div>
          <div class="qp-body" id="fillBody"></div>
        </div>

        <!-- ---- Tự luận ---- -->
        <div class="mode-pane" id="paneWritten" hidden>
          <div class="qp-head">
            <div>
              <h1 class="qp-title">Tự luận</h1>
              <p class="qp-sub" id="writtenSub">—</p>
            </div>
            <div class="qp-tools">
              <button class="btn-ghost" id="writtenReset" type="button">Ẩn đáp án</button>
            </div>
          </div>
          <div class="qp-body" id="writtenBody"></div>
        </div>

        <!-- ---- Ghi chú ---- -->
        <div class="mode-pane" id="paneNotes" hidden>
          <div class="qp-head">
            <div>
              <h1 class="qp-title">Ghi chú của tôi</h1>
              <p class="qp-sub" id="notesSub">—</p>
            </div>
            <div class="qp-tools">
              <button class="btn-ghost" id="notesExport" type="button">Tải .md</button>
              <button class="btn-ghost danger" id="notesClear" type="button">Xoá tất cả</button>
            </div>
          </div>
          <div class="qp-body" id="notesBody"></div>
        </div>
      </section>
    </main>

  <!-- ============ panel gia sư AI: trượt từ phải ============ -->
  <aside class="ai-panel" id="aiPanel" aria-label="Gia sư AI" aria-hidden="true">
    <div class="ai-head">
      <span class="tag">Gia sư AI</span>
      <span class="model" id="aiModel">—</span>
      <button class="icon-btn ai-close" id="btnAiClose" type="button" title="Đóng" aria-label="Đóng gia sư AI">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="ai-thread" id="aiThread"></div>

    <div class="ai-composer">
      <textarea id="ta" rows="2" placeholder="Hỏi về bài đang mở…  (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
      <div class="ai-actions">
        <span class="hint">Ctrl+K · vào ô hỏi</span>
        <button class="btn-clear" id="btnClear" type="button">Xoá</button>
        <button class="btn-send" id="btnSend" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
          Hỏi
        </button>
      </div>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js?v=22"></script>
  <script src="js/quiz.js?v=22"></script>
</body>
</html>
